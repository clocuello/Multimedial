<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Estructura con Divisiones</title>

    <style>
        /* Estilo general del cuerpo */
        body {
            font-family: Arial, sans-serif;
            background-color: #ecc5034d;
            margin: 0;
        }

        /* Contenedor principal */
        .contenedor {
            width: 80%;
            margin: auto;
        }

        /* Sección o bloque */
        .bloque {
            background-color: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
        }

        /* Imagen */
        .bloque img {
            width: 100%;
            height: auto;
        }

        /* Encabezado */
        .bloque h2 {
            margin-top: 10px;
        }

        /* Texto */
        .bloque p {
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <!-- Contenedor principal -->
    <div class="contenedor">

        <!-- BLOQUE 1 -->
        <div class="bloque">
            <img src="img/IMG_7841.jpeg" alt="Descripción de la imagen">
            <h2>Ausencia del yo</h2>
            <p>
                Grafito sobre
                papel.
                (2.31x1.87cm)
            </p>
        </div>

        <!-- BLOQUE 2 -->
        <div class="bloque">
            <img src="img/IMG_0846.jpeg" alt="Descripción de la imagen">
            <h2>El frio de la calidez</h2>
            <p>
                Óleo sobre tela
                (bastidor de
                1.40x1.00cm)
            </p>
        </div>

        <!-- BLOQUE 3 -->
        <div class="bloque">
            <img src="img/IMG_8007.jpeg" alt="Descripción de la imagen">
            <h2>Vacio</h2>
            <p>
                Óleo sobre tela 
                (bastidor de
                70x70cm)
            </p>
        </div>
        <!-- BLOQUE 3 -->
        <div class="bloque">
            
            <a href="index.html">Inicio</a><br>
            <a href="contacto.html">Contacto</a>
        </div>
    </div>

</body>
</html>
