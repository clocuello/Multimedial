<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Estructura con Divisiones</title>

    <style>
        /* Estilo general del cuerpo */
        body {
            font-family: Arial, sans-serif;
            background-color: #c6a70e57;
            margin: 0;
        }

        /* Contenedor principal */
        .contenedor {
            width: 80%;
            margin: auto;
        }

        /* Sección o bloque */
        .bloque {
            background-color: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
        }

        /* Imagen */
        .bloque img {
            width: 100%;
            height: auto;
        }

        /* Encabezado */
        .bloque h2 {
            margin-top: 10px;
        }

        /* Texto */
        .bloque p {
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <!-- Contenedor principal -->
    <div class="contenedor">
        <h1>Contacto</h1>

        <!-- BLOQUE 1 -->
        <div class="bloque">
            <img src="" alt="">
            <h2></h2>
            <p>
                Correo: Clau.cuello1@gmail.com

            </p>

            <p>

                Telefono: +569 49968052

            </p>
        </div>

            <a href="index.html">Inicio</a><br>
            <a href="obra.html">Obra</a>
       
    </div>

</body>
</html>
